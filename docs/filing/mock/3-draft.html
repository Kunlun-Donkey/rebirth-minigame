<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  .head { position: absolute; top: 60px; left: 0; right: 0; }
  .steps { position: absolute; top: 160px; left: 40px; right: 40px; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--sans); font-size: 13px; color: var(--ink-2); }
  .steps .s { padding: 4px 14px; border-radius: 14px; border: 1px solid rgba(122,74,31,.3); }
  .steps .s.on { background: var(--ochre); color: #fff; border-color: var(--ochre); }
  .steps .s.done { background: rgba(92,154,58,.15); color: #3c6b24; border-color: rgba(92,154,58,.4); }
  .steps .line { width: 20px; height: 1px; background: rgba(122,74,31,.3); }
  .cards { position: absolute; top: 236px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: start; }
  .card { position: relative; aspect-ratio: 2 / 3; background: url("../../../assets/resources/textures/common/frame/frame_common.png") 0 0 / 100% 100% no-repeat; filter: drop-shadow(0 6px 10px rgba(90,55,20,.18)); }
  .card.rare { background-image: url("../../../assets/resources/textures/common/frame/frame_rare.png"); }
  .card.epic { background-image: url("../../../assets/resources/textures/common/frame/frame_epic.png"); }
  .card.sel { transform: translateY(-12px) scale(1.04); filter: drop-shadow(0 0 10px rgba(142,91,201,.55)) drop-shadow(0 12px 16px rgba(90,55,20,.25)); }
  .badge { position: absolute; top: 2.2%; left: 50%; width: 26px; height: 26px; transform: translateX(-50%); }
  .card .art { position: absolute; left: 10.3%; right: 10.3%; top: 10.7%; height: 32.2%; display: flex; align-items: center; justify-content: center; }
  .card .art img { width: 64px; height: 64px; }
  .txt { position: absolute; left: 9%; right: 9%; top: 47%; text-align: center; }
  .rar { font-size: 10px; font-family: var(--sans); letter-spacing: 2px; }
  .nm { margin-top: 1px; font-size: 17px; letter-spacing: 2px; }
  .ds { margin-top: 6px; font-size: 11.5px; line-height: 1.55; color: var(--ink-2); text-align: left; }
  .relic { position: absolute; top: 540px; left: 20px; right: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-2); }
  .relic .ri { width: 40px; height: 40px; border-radius: 10px; background: #f3e1b6; display: flex; align-items: center; justify-content: center; }
  .relic b { color: var(--ink); font-weight: normal; font-size: 16px; }
  .legacy-row { position: absolute; top: 618px; left: 20px; right: 20px; font-size: 13px; font-family: var(--sans); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .acts { position: absolute; left: 20px; right: 20px; top: 740px; display: flex; flex-direction: column; gap: 14px; }
</style></head>
<body>
  <div class="head">
    <div class="title">第 8 世 · 重生</div>
    <div class="subtitle">你又是一颗草籽了。这一世，带上点什么？</div>
  </div>

  <div class="steps">
    <span class="s on">天赋</span><span class="line"></span><span class="s">道具</span><span class="line"></span><span class="s">伙伴</span>
  </div>

  <div class="cards">
    <div class="card">
      <img class="badge" src="../../../assets/resources/textures/common/frame/badge_talent.png">
      <div class="art"><img src="../../../assets/resources/textures/common/icon/talent_vitality.png"></div>
      <div class="txt"><div class="rar" style="color:#9a8460">普通</div><div class="nm">耐旱</div><div class="ds">每 2 季才消耗一次水分。</div></div>
    </div>
    <div class="card rare">
      <img class="badge" src="../../../assets/resources/textures/common/frame/badge_talent.png">
      <div class="art"><img src="../../../assets/resources/textures/common/icon/talent_wisdom.png"></div>
      <div class="txt"><div class="rar" style="color:var(--rare)">稀有</div><div class="nm">直觉</div><div class="ds">每个事件有 35% 概率预知一个选项的结果。</div></div>
    </div>
    <div class="card epic sel">
      <img class="badge" src="../../../assets/resources/textures/common/frame/badge_talent.png">
      <div class="art"><img src="../../../assets/resources/textures/common/icon/talent_bloodline.png"></div>
      <div class="txt"><div class="rar" style="color:var(--epic)">史诗</div><div class="nm">建木血脉</div><div class="ds">灵气获取 ×2。</div></div>
    </div>
  </div>

  <div class="relic paper">
    <span class="ri"><svg width="26" height="26" viewBox="0 0 26 26"><ellipse cx="13" cy="14" rx="8" ry="10" fill="#c48a3e"/><ellipse cx="13" cy="14" rx="11" ry="12" fill="#f3c962" opacity=".35"/></svg></span>
    <div>上一世封存的遗物<br><b>古代种子</b> · 使用：灵性 +2，灵气 +5</div>
  </div>

  <div class="legacy-row">传承
    <span class="tag legacy">耐火根 Lv2</span><span class="tag legacy">储水细胞 Lv1</span><span class="tag legacy">苦涩汁液 Lv1</span>
  </div>

  <div class="acts">
    <div class="btn primary">选 择</div>
    <div class="btn ad">天机重演 · 看视频刷新本池（1/1）</div>
  </div>
</body></html>
