<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { background: url("../../../assets/resources/textures/common/fx/fx_breakthrough.jpg") center -130px / 1200px no-repeat, radial-gradient(ellipse at 50% 58%, #2f4a2a 0%, #1d2a22 40%, #141a20 75%, #0f1318 100%); color: #f6ecd2; }
  .stars { position: absolute; inset: 0; }
  .label { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font-size: 16px; letter-spacing: 10px; color: #cfe7b0; opacity: .85; }
  .big { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-size: 84px; letter-spacing: 18px; color: #fff6d6; text-shadow: 0 0 24px rgba(155,211,106,.8), 0 0 60px rgba(155,211,106,.5); }
  .from { position: absolute; top: 262px; left: 0; right: 0; text-align: center; font-size: 15px; color: #b9c8a8; letter-spacing: 3px; }
  .hero { position: absolute; top: 300px; left: 0; right: 0; display: flex; justify-content: center; }
  .narr { position: absolute; top: 640px; left: 40px; right: 40px; text-align: center; font-size: 21px; line-height: 1.8; color: #fff6d6; letter-spacing: 2px; }
  .gain { position: absolute; top: 726px; left: 40px; right: 40px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-family: var(--sans); font-size: 14px; color: #cfe7b0; }
  .gain .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { padding: 4px 12px; border-radius: 14px; border: 1px solid rgba(155,211,106,.5); background: rgba(155,211,106,.12); }
  .chip.skill { border-color: rgba(226,176,74,.7); background: rgba(226,176,74,.15); color: #ffd98a; }
  .tap { position: absolute; bottom: 60px; left: 0; right: 0; text-align: center; font-size: 13px; color: #8b9a86; letter-spacing: 4px; }
</style></head>
<body>
  <svg class="stars" viewBox="0 0 540 960">
    <g fill="#fff6d6">
      <circle cx="40" cy="60" r="1.2" opacity=".7"/><circle cx="120" cy="30" r="1" opacity=".5"/><circle cx="480" cy="80" r="1.4" opacity=".8"/><circle cx="420" cy="140" r="1" opacity=".5"/>
      <circle cx="70" cy="210" r="1" opacity=".6"/><circle cx="500" cy="260" r="1.2" opacity=".6"/><circle cx="30" cy="420" r="1" opacity=".4"/><circle cx="510" cy="460" r="1" opacity=".5"/>
      <circle cx="300" cy="40" r="1" opacity=".6"/><circle cx="200" cy="100" r="1.3" opacity=".5"/>
    </g>
  </svg>

  <div class="label">境 界 突 破</div>
  <div class="big">灵草</div>
  <div class="from">小草 → 灵草</div>

  <div class="hero">
    <svg width="440" height="320" viewBox="0 0 440 320">
      <defs>
        <radialGradient id="glow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#d6f5a8" stop-opacity=".75"/><stop offset=".4" stop-color="#9bd36a" stop-opacity=".3"/><stop offset="1" stop-color="#9bd36a" stop-opacity="0"/></radialGradient>
        <linearGradient id="sandn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c4a33"/><stop offset="1" stop-color="#2a2219"/></linearGradient>
      </defs>
      
      <g stroke="#d6f5a8" stroke-width="1.5" opacity=".35">
        <line x1="220" y1="170" x2="220" y2="0"/><line x1="220" y1="170" x2="90" y2="20"/><line x1="220" y1="170" x2="350" y2="20"/>
        <line x1="220" y1="170" x2="30" y2="120"/><line x1="220" y1="170" x2="410" y2="120"/>
      </g>
      <path d="M0 270 Q110 245 220 262 T440 258 V320 H0Z" fill="url(#sandn)"/>
      <g transform="translate(220 262)">
        <path d="M0 0 C-3 -40 4 -80 0 -150" stroke="#6fb04a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M0 -50 C-30 -60 -54 -54 -70 -38 C-44 -30 -20 -36 0 -50Z" fill="#7bb556"/>
        <path d="M1 -80 C30 -100 58 -96 72 -80 C46 -68 22 -70 1 -80Z" fill="#9bd36a"/>
        <path d="M0 -112 C-24 -130 -44 -128 -56 -116 C-36 -104 -16 -104 0 -112Z" fill="#8cc95c"/>
        <path d="M0 -150 C-10 -170 -4 -190 8 -196 C14 -178 10 -162 0 -150Z" fill="#c3ec8f"/>
        <g stroke="#ffd27a" stroke-width="1.6" fill="none" opacity=".9">
          <path d="M-10 -44 C-28 -46 -44 -44 -58 -38"/><path d="M10 -82 C28 -88 44 -88 60 -82"/><path d="M-8 -114 C-22 -118 -34 -118 -46 -116"/>
        </g>
      </g>
      <g fill="#ffe9a8"><circle cx="150" cy="120" r="3"/><circle cx="300" cy="96" r="2.5"/><circle cx="330" cy="180" r="2"/><circle cx="110" cy="200" r="2"/><circle cx="260" cy="60" r="2"/><circle cx="180" cy="70" r="1.6"/></g>
    </svg>
  </div>

  <div class="narr">沙漠里的风，<br>开始绕着你走。</div>
  <div class="gain">
    <div class="row"><span class="chip">解锁：与动物对话</span><span class="chip">寿命上限提升</span></div>
    <div class="row"><span class="chip skill">领悟技能 · 草木皆兵</span></div>
  </div>

  <div class="tap">轻 触 继 续</div>
</body></html>
