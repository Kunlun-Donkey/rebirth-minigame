<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { background: #f3dcae url("img/settle_bg_ending.jpg") center bottom / cover no-repeat; }
  .head { position: absolute; top: 40px; left: 0; right: 0; text-align: center; }
  .head .t { font-size: 15px; letter-spacing: 10px; color: var(--ochre-d); }
  .head .big { margin-top: 6px; font-size: 44px; letter-spacing: 12px; color: #5a3410; text-shadow: 0 2px 12px rgba(255,240,200,.9); }
  .card { position: absolute; top: 152px; left: 34px; right: 34px; padding: 36px 44px 30px; text-align: center;
    background: url("../../../assets/resources/textures/common/ui/ending_card.png") 0 0 / 100% 100% no-repeat; filter: drop-shadow(0 8px 18px rgba(122,74,31,.3)); }
  .card .leaf { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); }
  .card .no { font-size: 13px; color: var(--ink-2); letter-spacing: 2px; }
  .card .epi { margin-top: 10px; font-size: 18px; line-height: 1.8; color: var(--ink); }
  .card .meta { margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(122,74,31,.35); display: flex; justify-content: space-around; font-family: var(--sans); font-size: 12px; color: var(--ink-2); }
  .panel { position: absolute; top: 704px; left: 24px; right: 24px; padding: 12px 20px; background: linear-gradient(180deg, rgba(251,243,225,.93), rgba(244,229,198,.93)); }
  .line { display: flex; justify-content: space-between; font-size: 14px; line-height: 1.85; color: var(--ink-2); font-family: var(--sans); }
  .line b { color: var(--ink); font-weight: 500; }
  .line .up { color: #3c8a2a; }
  .total b { font-size: 20px; color: #d99a2b; }
  .acts { position: absolute; left: 24px; right: 24px; top: 838px; display: flex; flex-direction: column; gap: 10px; }
  .acts .btn { padding: 11px 18px; }
</style></head>
<body>
  <div class="head">
    <div class="t">达 成 结 局</div>
    <div class="big">荒漠树妖</div>
  </div>

  <div class="card">
    
    <div class="no">第 12 世 · 树妖 · 享年 41 季</div>
    <div class="epi">你成了荒漠里第一棵会思考的树。<br>故事还没完，世界树还在远方。</div>
    <div class="meta"><span>最深 · 熔岩层</span><span>最高 · 雷云</span><span>最远 · 枯萎绿洲</span></div>
  </div>

  <div class="panel paper grain">
    <div class="line"><span>结局图鉴 · 荒漠树妖</span><b class="up">首次解锁</b></div>
    <div class="line"><span>领悟技能 · 藤缚</span><b class="up">已加入技能图鉴</b></div>
    <div class="line total"><span>轮回点</span><span><b>+120</b>　累计 1046</span></div>
  </div>

  <div class="acts">
    <div class="btn ad">看视频 · 轮回点翻倍</div>
    <div class="btn primary">再次重生</div>
  </div>
</body></html>
