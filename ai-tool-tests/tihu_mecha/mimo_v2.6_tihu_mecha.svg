<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>mimo_v2.6_tihu_mecha</title>
  <defs>
    <mask id="cut">
      <circle cx="256" cy="256" r="240" fill="#fff"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fc4e8"/>
      <stop offset="1" stop-color="#d4edf8"/>
    </linearGradient>
    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c49a6c"/>
      <stop offset="1" stop-color="#8f7048"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fa8ba"/>
      <stop offset="1" stop-color="#4a6b7c"/>
    </linearGradient>
    <linearGradient id="beakg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b45c"/>
      <stop offset="1" stop-color="#e8963c"/>
    </linearGradient>
  </defs>

  <!-- 圆形遮罩裁剪整个画面 -->
  <g mask="url(#cut)">
    <!-- 整体 skewX(-5) -->
    <g transform="translate(256,256) skewX(-5) translate(-256,-256)">

      <!-- ===== 背景 ===== -->
      <rect x="-40" y="-40" width="592" height="592" fill="url(#sky)"/>
      <circle cx="412" cy="102" r="32" fill="#f6d067" stroke="#e3b64c" stroke-width="4"/>
      <g fill="#ffffff" opacity="0.85">
        <ellipse cx="118" cy="108" rx="38" ry="16"/>
        <ellipse cx="150" cy="100" rx="26" ry="13"/>
        <ellipse cx="90" cy="102" rx="22" ry="12"/>
        <ellipse cx="340" cy="82" rx="30" ry="13"/>
        <ellipse cx="366" cy="76" rx="20" ry="11"/>
      </g>
      <rect x="-40" y="418" width="592" height="140" fill="url(#roadg)"/>
      <rect x="-40" y="418" width="592" height="12" fill="#6d5535"/>

      <!-- 地面纹理向后滚动 -->
      <g stroke="#7a5e3c" stroke-width="5" stroke-linecap="round" opacity="0.5">
        <line x1="-120" y1="452" x2="-80" y2="452"/>
        <line x1="-40" y1="452" x2="0" y2="452"/>
        <line x1="40" y1="452" x2="80" y2="452"/>
        <line x1="120" y1="452" x2="160" y2="452"/>
        <line x1="200" y1="452" x2="240" y2="452"/>
        <line x1="280" y1="452" x2="320" y2="452"/>
        <line x1="360" y1="452" x2="400" y2="452"/>
        <line x1="440" y1="452" x2="480" y2="452"/>
        <line x1="520" y1="452" x2="560" y2="452"/>
        <line x1="-80" y1="488" x2="-48" y2="488"/>
        <line x1="0" y1="488" x2="32" y2="488"/>
        <line x1="80" y1="488" x2="112" y2="488"/>
        <line x1="160" y1="488" x2="192" y2="488"/>
        <line x1="240" y1="488" x2="272" y2="488"/>
        <line x1="320" y1="488" x2="352" y2="488"/>
        <line x1="400" y1="488" x2="432" y2="488"/>
        <line x1="480" y1="488" x2="512" y2="488"/>
        <line x1="560" y1="488" x2="592" y2="488"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;-80 0" dur="0.55s" repeatCount="indefinite"/>
      </g>

      <!-- 速度线闪动 -->
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
        <line x1="58" y1="150" x2="122" y2="150">
          <animate attributeName="opacity" values="0.1;0.95;0.15;0.9;0.1" dur="0.66s" repeatCount="indefinite"/>
        </line>
        <line x1="44" y1="212" x2="114" y2="212">
          <animate attributeName="opacity" values="0.85;0.1;0.9;0.15;0.85" dur="0.66s" repeatCount="indefinite"/>
        </line>
        <line x1="66" y1="274" x2="126" y2="274">
          <animate attributeName="opacity" values="0.15;0.85;0.1;0.95;0.15" dur="0.72s" repeatCount="indefinite"/>
        </line>
        <line x1="48" y1="336" x2="108" y2="336">
          <animate attributeName="opacity" values="0.9;0.15;0.85;0.1;0.9" dur="0.72s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- ===== 推进器烟圈（机甲背后） ===== -->
      <g fill="none" stroke="#9aa8b0" stroke-width="4">
        <circle cx="176" cy="238" r="8" opacity="0">
          <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.2;1" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="176;120;64" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="r" values="6;14;22" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="176" cy="238" r="8" opacity="0">
          <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.2;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="176;120;64" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
          <animate attributeName="r" values="6;14;22" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="176" cy="238" r="8" opacity="0">
          <animate attributeName="opacity" values="0;0.8;0" keyTimes="0;0.2;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="cx" values="176;120;64" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="r" values="6;14;22" dur="1.8s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ===== 远侧手臂（躯干后面） ===== -->
      <g>
        <g>
          <path d="M 212,218 Q 176,250 178,286" fill="none" stroke="#2d1a12" stroke-width="24" stroke-linecap="round"/>
          <path d="M 212,218 Q 176,250 178,286" fill="none" stroke="#5e8496" stroke-width="14" stroke-linecap="round"/>
          <circle cx="178" cy="290" r="15" fill="#4a6b7c" stroke="#2d1a12" stroke-width="5"/>
          <animateTransform attributeName="transform" type="rotate" values="6 212 218;-6 212 218;6 212 218" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- ===== 远侧腿（躯干后面，180° 相位） ===== -->
      <g>
        <g>
          <!-- 大腿 -->
          <path d="M 242,296 L 232,352" fill="none" stroke="#2d1a12" stroke-width="26" stroke-linecap="round"/>
          <path d="M 242,296 L 232,352" fill="none" stroke="#4a6b7c" stroke-width="16" stroke-linecap="round"/>
          <g>
            <!-- 小腿 -->
            <path d="M 232,352 L 242,406" fill="none" stroke="#2d1a12" stroke-width="24" stroke-linecap="round"/>
            <path d="M 232,352 L 242,406" fill="none" stroke="#5e8496" stroke-width="14" stroke-linecap="round"/>
            <!-- 脚掌 -->
            <rect x="212" y="402" width="58" height="22" rx="8" fill="#4a6b7c" stroke="#2d1a12" stroke-width="5"/>
            <animateTransform attributeName="transform" type="rotate" values="0 232 352;-16 232 352;0 232 352" dur="1.2s" repeatCount="indefinite"/>
          </g>
          <circle cx="232" cy="352" r="11" fill="#7fa8ba" stroke="#2d1a12" stroke-width="4"/>
          <animateTransform attributeName="transform" type="rotate" values="7 242 296;-7 242 296;7 242 296" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- ===== 机甲躯干（含驾驶舱/头/天线/近臂，走路时轻微起伏） ===== -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -3;0 0" dur="0.6s" repeatCount="indefinite"/>
        <!-- 背部推进器 -->
        <rect x="178" y="212" width="34" height="56" rx="10" fill="#4a6b7c" stroke="#2d1a12" stroke-width="5"/>
        <path d="M 178,228 L 160,236 L 178,248 Z" fill="#8d949c" stroke="#2d1a12" stroke-width="4"/>
        <!-- 主装甲 -->
        <rect x="196" y="192" width="132" height="112" rx="18" fill="url(#armor)" stroke="#2d1a12" stroke-width="7"/>
        <!-- 胸甲板 -->
        <rect x="212" y="212" width="100" height="52" rx="10" fill="#6b93a5" stroke="#2d1a12" stroke-width="4"/>
        <!-- 铆钉（虚线描边） -->
        <path d="M 218,272 L 306,272" fill="none" stroke="#2d1a12" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
        <path d="M 218,282 L 306,282" fill="none" stroke="#2d1a12" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
        <!-- 仪表 -->
        <rect x="296" y="222" width="26" height="26" rx="5" fill="#2d3f4a" stroke="#2d1a12" stroke-width="3"/>
        <circle cx="303" cy="230" r="3" fill="#e8542f"/>
        <circle cx="314" cy="230" r="3" fill="#4cd964"/>
        <rect x="300" y="238" width="18" height="5" rx="2" fill="#7fd4ff"/>
        <!-- 软管（双层描边 Q…T…） -->
        <path d="M 300,264 Q 332,262 342,242 T 344,206" fill="none" stroke="#2d1a12" stroke-width="12" stroke-linecap="round"/>
        <path d="M 300,264 Q 332,262 342,242 T 344,206" fill="none" stroke="#8d949c" stroke-width="5" stroke-dasharray="2 8" stroke-linecap="round"/>

      <!-- ===== 驾驶舱框 ===== -->
      <g>
        <rect x="216" y="150" width="112" height="52" rx="12" fill="#2d3f4a" stroke="#2d1a12" stroke-width="6"/>
        <rect x="226" y="158" width="92" height="38" rx="8" fill="#7fd4ff" stroke="#2d1a12" stroke-width="3" opacity="0.85"/>
        <!-- 舱盖框 -->
        <path d="M 220,152 Q 272,128 326,152" fill="none" stroke="#2d1a12" stroke-width="8" stroke-linecap="round"/>
      </g>

      <!-- ===== 鹈鹕头颈 + 喉囊（从舱顶伸出） ===== -->
      <g>
        <!-- 脖子（双层描边） -->
        <path d="M 262,168 Q 240,132 246,102 T 272,68" fill="none" stroke="#2d1a12" stroke-width="30" stroke-linecap="round"/>
        <path d="M 262,168 Q 240,132 246,102 T 272,68" fill="none" stroke="#f5efe4" stroke-width="18" stroke-linecap="round"/>

        <!-- 头 -->
        <g>
          <ellipse cx="288" cy="64" rx="34" ry="30" fill="#f5efe4" stroke="#2d1a12" stroke-width="6"/>
          <!-- 眼睛（眨眼，以中心缩放） -->
          <g transform="translate(300,54)">
            <g>
              <animateTransform attributeName="transform" type="scale"
                values="1 1;1 1;1 0.12;1 1;1 1" keyTimes="0;0.47;0.5;0.53;1" dur="4s" repeatCount="indefinite"/>
              <ellipse rx="9" ry="10" fill="#fff" stroke="#2d1a12" stroke-width="3"/>
              <circle cx="2" cy="1" r="4.5" fill="#2d1a12"/>
              <circle cx="4" cy="-2" r="1.8" fill="#fff"/>
            </g>
          </g>

          <!-- 大嘴（上喙） -->
          <path d="M 312,52 Q 372,44 418,62 Q 372,70 312,70 Z" fill="url(#beakg)" stroke="#2d1a12" stroke-width="5" stroke-linejoin="round"/>
          <!-- 喉囊 + 下喙（双层描边，会鼓动） -->
          <g transform="translate(312,70)">
            <g>
              <animateTransform attributeName="transform" type="scale"
                values="1 1;1.06 1.06;1 1" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
              <path d="M 0,0 Q 68,2 106,-8 Q 100,38 60,56 Q 16,66 -2,38 Z"
                    fill="#f2b45c" stroke="#2d1a12" stroke-width="5" stroke-linejoin="round"/>
              <path d="M 6,14 Q 56,16 90,2" fill="none" stroke="#e8963c" stroke-width="4" stroke-linecap="round"/>
            </g>
          </g>
          <!-- 头顶羽毛 -->
          <path d="M 272,38 Q 268,22 280,14" fill="none" stroke="#2d1a12" stroke-width="5" stroke-linecap="round"/>
          <path d="M 282,34 Q 282,18 296,12" fill="none" stroke="#2d1a12" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ===== 天线 ===== -->
      <g>
        <line x1="326" y1="150" x2="352" y2="96" stroke="#2d1a12" stroke-width="6" stroke-linecap="round"/>
        <circle cx="354" cy="90" r="9" fill="#e8542f" stroke="#2d1a12" stroke-width="4">
          <animate attributeName="fill" values="#e8542f;#e8542f;#ffb3a0;#e8542f;#e8542f"
            keyTimes="0;0.4;0.5;0.6;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="354" cy="90" r="16" fill="none" stroke="#e8542f" stroke-width="3" opacity="0">
          <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.4;0.5;0.7;1" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="r" values="9;9;20;22;22" keyTimes="0;0.4;0.55;0.7;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- ===== 驾驶舱内操纵杆 + 翼尖缠绕 ===== -->
      <g>
        <line x1="242" y1="196" x2="242" y2="158" stroke="#2d1a12" stroke-width="7" stroke-linecap="round"/>
        <circle cx="242" cy="154" r="9" fill="#3a3f46" stroke="#2d1a12" stroke-width="4"/>
        <line x1="292" y1="198" x2="292" y2="160" stroke="#2d1a12" stroke-width="7" stroke-linecap="round"/>
        <circle cx="292" cy="156" r="9" fill="#3a3f46" stroke="#2d1a12" stroke-width="4"/>
        <!-- 翼尖（双层描边，缠在杆上） -->
        <path d="M 258,178 Q 248,162 244,154 Q 238,150 236,158 Q 236,166 244,164"
              fill="none" stroke="#2d1a12" stroke-width="13" stroke-linecap="round"/>
        <path d="M 258,178 Q 248,162 244,154 Q 238,150 236,158 Q 236,166 244,164"
              fill="none" stroke="#f5efe4" stroke-width="6" stroke-dasharray="2 7" stroke-linecap="round"/>
        <path d="M 308,180 Q 300,164 294,156 Q 288,152 286,160 Q 286,168 294,166"
              fill="none" stroke="#2d1a12" stroke-width="13" stroke-linecap="round"/>
        <path d="M 308,180 Q 300,164 294,156 Q 288,152 286,160 Q 286,168 294,166"
              fill="none" stroke="#f5efe4" stroke-width="6" stroke-dasharray="2 7" stroke-linecap="round"/>
      </g>

      <!-- ===== 近侧手臂（躯干前面，举着一条鱼） ===== -->
      <g>
        <g>
          <path d="M 318,214 Q 356,230 370,258" fill="none" stroke="#2d1a12" stroke-width="24" stroke-linecap="round"/>
          <path d="M 318,214 Q 356,230 370,258" fill="none" stroke="#5e8496" stroke-width="14" stroke-linecap="round"/>
          <!-- 手掌 -->
          <circle cx="374" cy="264" r="15" fill="#6b93a5" stroke="#2d1a12" stroke-width="5"/>
          <!-- 鱼 -->
          <g>
            <g>
              <animateTransform attributeName="transform" type="rotate"
                values="0 374 264;0 374 264;10 374 264;-8 374 264;0 374 264"
                keyTimes="0;0.62;0.68;0.74;0.82" dur="3s" repeatCount="indefinite"/>
              <path d="M 372,252 Q 414,238 448,254 Q 414,270 372,258 Z" fill="#7fd4ff" stroke="#2d1a12" stroke-width="4" stroke-linejoin="round"/>
              <path d="M 448,254 L 474,238 L 470,256 L 474,272 Z" fill="#5eb8e8" stroke="#2d1a12" stroke-width="4" stroke-linejoin="round"/>
              <circle cx="392" cy="252" r="4" fill="#2d1a12"/>
              <path d="M 412,246 Q 420,254 412,262" fill="none" stroke="#2d1a12" stroke-width="3" stroke-linecap="round"/>
            </g>
          </g>
          <animateTransform attributeName="transform" type="rotate" values="-5 318 214;5 318 214;-5 318 214" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>
      </g>

      <!-- ===== 近侧腿（躯干前面） ===== -->
      <g>
        <g>
          <!-- 大腿 -->
          <path d="M 282,296 L 296,352" fill="none" stroke="#2d1a12" stroke-width="26" stroke-linecap="round"/>
          <path d="M 282,296 L 296,352" fill="none" stroke="#6b93a5" stroke-width="16" stroke-linecap="round"/>
          <g>
            <!-- 小腿 -->
            <path d="M 296,352 L 288,406" fill="none" stroke="#2d1a12" stroke-width="24" stroke-linecap="round"/>
            <path d="M 296,352 L 288,406" fill="none" stroke="#7fa8ba" stroke-width="14" stroke-linecap="round"/>
            <!-- 脚掌 -->
            <rect x="258" y="402" width="58" height="22" rx="8" fill="#6b93a5" stroke="#2d1a12" stroke-width="5"/>
            <animateTransform attributeName="transform" type="rotate" values="0 296 352;16 296 352;0 296 352" dur="1.2s" repeatCount="indefinite"/>
          </g>
          <circle cx="296" cy="352" r="11" fill="#9dc2cf" stroke="#2d1a12" stroke-width="4"/>
          <animateTransform attributeName="transform" type="rotate" values="-7 282 296;7 282 296;-7 282 296" dur="1.2s" repeatCount="indefinite"/>
        </g>
      </g>

      <!-- 髋部装甲 -->
      <rect x="228" y="286" width="70" height="30" rx="10" fill="#4a6b7c" stroke="#2d1a12" stroke-width="5"/>
    </g>
  </g>

  <!-- 圆外描边 -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#2d1a12" stroke-width="12"/>
  <circle cx="256" cy="256" r="227" fill="none" stroke="#2d1a12" stroke-width="3" opacity="0.35"/>
</svg>
