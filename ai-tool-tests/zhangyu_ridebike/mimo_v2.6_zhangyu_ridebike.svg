          <path d="M 300,186 Q 302,214 284,236" fill="none" stroke="#2a2126" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- 左眼（会眨，以眼睛中心缩放） -->
        <g transform="translate(228,176)">
          <g>
