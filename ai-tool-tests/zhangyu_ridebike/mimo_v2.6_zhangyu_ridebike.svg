    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c49a6c"/>
      <stop offset="1" stop-color="#8f7048"/>
    </linearGradient>
    <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2a07c"/>
      <stop offset="1" stop-color="#d97757"/>
