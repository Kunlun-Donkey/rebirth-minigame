                    M 268,262 Q 328,304 300,342 T 262,356 Q 252,348 262,342;
                    M 268,262 Q 322,316 280,350 T 238,346 Q 230,336 242,332;
                    M 268,262 Q 312,320 262,342 T 228,322 Q 222,312 234,310;
                    M 268,262 Q 306,306 262,318 T 238,298 Q 234,288 246,290;
                    M 268,262 Q 306,292 272,302 T 262,288 Q 260,278 272,282;
                    M 268,262 Q 314,280 296,296 T 286,298 Q 280,288 292,290"/>
        </path>
        <path stroke="#f4b092" stroke-width="8" stroke-dasharray="2 9" d="M 268,262 Q 318,276 322,308 T 296,322 Q 286,316 294,308">
          <animate attributeName="d" dur="1.2s" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" repeatCount="indefinite"
            values="M 268,262 Q 318,276 322,308 T 296,322 Q 286,316 294,308;
                    M 268,262 Q 326,288 312,322 T 286,346 Q 276,338 286,332;
                    M 268,262 Q 328,304 300,342 T 262,356 Q 252,348 262,342;
                    M 268,262 Q 322,316 280,350 T 238,346 Q 230,336 242,332;
                    M 268,262 Q 312,320 262,342 T 228,322 Q 222,312 234,310;
                    M 268,262 Q 306,306 262,318 T 238,298 Q 234,288 246,290;
                    M 268,262 Q 306,292 272,302 T 262,288 Q 260,278 272,282;
                    M 268,262 Q 314,280 296,296 T 286,298 Q 280,288 292,290"/>
        </path>
