        <line x1="-40" y1="414" x2="0" y2="414"/>
        <line x1="40" y1="414" x2="80" y2="414"/>
        <line x1="120" y1="414" x2="160" y2="414"/>
        <line x1="200" y1="414" x2="240" y2="414"/>
        <line x1="280" y1="414" x2="320" y2="414"/>
        <line x1="360" y1="414" x2="400" y2="414"/>
        <line x1="440" y1="414" x2="480" y2="414"/>
        <line x1="520" y1="414" x2="560" y2="414"/>
        <line x1="-80" y1="452" x2="-48" y2="452"/>
        <line x1="0" y1="452" x2="32" y2="452"/>
        <line x1="80" y1="452" x2="112" y2="452"/>
        <line x1="160" y1="452" x2="192" y2="452"/>
        <line x1="240" y1="452" x2="272" y2="452"/>
        <line x1="320" y1="452" x2="352" y2="452"/>
        <line x1="400" y1="452" x2="432" y2="452"/>
