                    M 252,228 Q 218,248 236,272 T 262,288 Q 255,280 265,278;
                    M 252,228 Q 222,252 252,278 T 286,298 Q 280,290 290,288;
                    M 252,228 Q 226,258 268,292 T 296,322 Q 291,313 301,311;
                    M 252,228 Q 222,268 262,314 T 286,346 Q 281,337 291,335;
                    M 252,228 Q 212,274 242,326 T 262,356 Q 257,347 267,345;
