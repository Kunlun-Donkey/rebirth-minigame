            <line x1="382" y1="316" x2="415" y2="293"/>
            <line x1="382" y1="316" x2="428" y2="316"/>
            <line x1="382" y1="316" x2="415" y2="339"/>
            <line x1="382" y1="316" x2="382" y2="362"/>
            <line x1="382" y1="316" x2="349" y2="339"/>
            <line x1="382" y1="316" x2="336" y2="316"/>
