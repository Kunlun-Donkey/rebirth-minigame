      <!-- 近侧踩踏触手（尖卷在踏板上，压在踏板下层） -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path stroke="#4a1f14" stroke-width="18" d="M 268,262 Q 318,276 322,308 T 296,322 Q 286,316 294,308">
          <animate attributeName="d" dur="1.2s" calcMode="discrete" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875" repeatCount="indefinite"
