            <line x1="150" y1="316" x2="183" y2="293"/>
            <line x1="150" y1="316" x2="196" y2="316"/>
            <line x1="150" y1="316" x2="183" y2="339"/>
            <line x1="150" y1="316" x2="150" y2="362"/>
            <line x1="150" y1="316" x2="117" y2="339"/>
            <line x1="150" y1="316" x2="104" y2="316"/>
            <line x1="150" y1="316" x2="117" y2="293"/>
