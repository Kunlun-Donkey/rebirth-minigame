        <g>
          <ellipse cx="250" cy="190" rx="13" ry="15" fill="#fff" stroke="#3a1f1f" stroke-width="4"/>
          <ellipse cx="254" cy="192" rx="6" ry="8" fill="#1d1d1d"/>
          <circle cx="256" cy="189" r="2" fill="#fff"/>
          <animateTransform attributeName="transform" type="translate" additive="sum" dur="4s" repeatCount="indefinite" values="0 0;0 0;0 171;0 0" keyTimes="0;0.9;0.95;1"/>
          <animateTransform attributeName="transform" type="scale" additive="sum" dur="4s" repeatCount="indefinite" values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.9;0.95;1"/>
        </g>
        <!-- 嘴 -->
        <path d="M222 224 Q232 234 244 224" fill="none" stroke="#3a1f1f" stroke-width="4" stroke-linecap="round"/>

        <!-- 海盗帽：轻晃 -->
        <g>
          <path d="M160 140 Q178 98 225 92 Q272 98 292 140 Q262 128 225 132 Q188 128 160 140 Z" fill="#232028" stroke="#0e0d10" stroke-width="4" stroke-linejoin="round"/>
          <path d="M150 142 Q190 120 225 126 Q262 120 302 142 Q262 136 225 140 Q188 136 150 142 Z" fill="#2f2b36" stroke="#0e0d10" stroke-width="4" stroke-linejoin="round"/>
          <path d="M158 140 Q190 126 225 130 Q262 126 294 140" fill="none" stroke="#d9a62e" stroke-width="3"/>
          <path d="M216 104 Q216 94 225 94 Q234 94 234 104 Q234 110 229 111 L229 115 L221 115 L221 111 Q216 110 216 104 Z" fill="#f4f1e6" stroke="#0e0d10" stroke-width="1.5"/>
          <path d="M221 102 L223 104 M229 102 L227 104" stroke="#0e0d10" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M212 112 L238 122 M238 112 L212 122" stroke="#f4f1e6" stroke-width="3" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite" values="0 225 135;-3 225 135;0 225 135"/>
        </g>

        <!-- ===== 近侧（车架前面）：触手踩近侧踏板 ===== -->
        <path d="M235 254 Q270 290 255 330 T275 400" fill="none" stroke="#3a1f1f" stroke-width="22" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M235 254 Q270 290 255 330 T275 400;M235 254 Q270 290 242.5 335 T250 410;M235 254 Q270 290 230 330 T225 400;M235 254 Q270 290 225 317.5 T215 375;M235 254 Q270 290 230 305 T225 350;M235 254 Q270 290 242.5 300 T250 340;M235 254 Q270 290 255 305 T275 350;M235 254 Q270 290 260 317.5 T285 375;M235 254 Q270 290 255 330 T275 400"/>
        </path>
        <path d="M235 254 Q270 290 255 330 T275 400" fill="none" stroke="#f0675a" stroke-width="15" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M235 254 Q270 290 255 330 T275 400;M235 254 Q270 290 242.5 335 T250 410;M235 254 Q270 290 230 330 T225 400;M235 254 Q270 290 225 317.5 T215 375;M235 254 Q270 290 230 305 T225 350;M235 254 Q270 290 242.5 300 T250 340;M235 254 Q270 290 255 305 T275 350;M235 254 Q270 290 260 317.5 T285 375;M235 254 Q270 290 255 330 T275 400"/>
        </path>
        <!-- 近侧曲柄 -->
        <g>
          <line x1="250" y1="375" x2="274.75" y2="399.75" stroke="#1d1d1d" stroke-width="9" stroke-linecap="round"/>
          <line x1="250" y1="375" x2="274.75" y2="399.75" stroke="#c7ced6" stroke-width="4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0 250 375" to="360 250 375" dur="1.2s" repeatCount="indefinite"/>
        </g>
        <!-- 近侧踏板 + 卷住踏板的触手尖（起点 45°） -->
        <g>
          <rect x="-15" y="-4.5" width="30" height="9" rx="3" fill="#777" stroke="#1d1d1d" stroke-width="3"/>
          <path d="M-7 -6 Q-13 2 -5 6 T9 0" fill="none" stroke="#3a1f1f" stroke-width="12" stroke-linecap="round"/>
          <path d="M-7 -6 Q-13 2 -5 6 T9 0" fill="none" stroke="#f0675a" stroke-width="6" stroke-linecap="round"/>
          <animateMotion dur="1.2s" repeatCount="indefinite" path="M274.75 399.75 A35 35 0 0 1 225.25 350.25 A35 35 0 0 1 274.75 399.75"/>
        </g>

        <!-- 触手握车把中段 -->
        <path d="M245 238 Q282 258 300 240 T340 246" fill="none" stroke="#3a1f1f" stroke-width="20" stroke-linecap="round"/>
        <path d="M245 238 Q282 258 300 240 T340 246" fill="none" stroke="#f0675a" stroke-width="13" stroke-linecap="round"/>
        <path d="M334 238 Q344 246 336 254" fill="none" stroke="#3a1f1f" stroke-width="10" stroke-linecap="round"/>
        <path d="M334 238 Q344 246 336 254" fill="none" stroke="#f0675a" stroke-width="5" stroke-linecap="round"/>

        <!-- 触手握车把握套（虚线=吸盘） -->
        <path d="M262 222 Q310 205 335 225 T380 246" fill="none" stroke="#3a1f1f" stroke-width="20" stroke-linecap="round"/>
        <path d="M262 222 Q310 205 335 225 T380 246" fill="none" stroke="#f0675a" stroke-width="13" stroke-linecap="round"/>
        <path d="M268 216 Q310 202 333 220 T374 240" fill="none" stroke="#ffd2c4" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
        <path d="M380 242 Q394 246 388 260 T378 256" fill="none" stroke="#3a1f1f" stroke-width="11" stroke-linecap="round"/>
        <path d="M380 242 Q394 246 388 260 T378 256" fill="none" stroke="#f0675a" stroke-width="5" stroke-linecap="round"/>

        <!-- 速度线 -->
        <path d="M40 330 L80 330 M30 360 L70 360 M45 390 L78 390" stroke="#5a3d22" stroke-width="3" stroke-linecap="round" opacity="0.5">
          <animate attributeName="opacity" dur="0.4s" repeatCount="indefinite" values="0.5;0.15;0.5"/>
          <animateTransform attributeName="transform" type="translate" dur="0.4s" repeatCount="indefinite" values="0 0;-12 0;0 0"/>
        </path>
      </g>
    </g>
  </g>

  <circle cx="256" cy="256" r="240" fill="none" stroke="#3a1f1f" stroke-width="6"/>
</svg>
