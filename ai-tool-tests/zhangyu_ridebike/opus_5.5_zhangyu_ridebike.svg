        <path d="M168 200 Q160 120 225 115 Q292 118 285 200 Q282 245 250 258 Q225 266 200 258 Q170 245 168 200 Z" fill="url(#mantle)" stroke="#3a1f1f" stroke-width="5" stroke-linejoin="round"/>
        <path d="M188 160 Q200 135 225 130" fill="none" stroke="#ffd2c4" stroke-width="5" stroke-linecap="round"/>

