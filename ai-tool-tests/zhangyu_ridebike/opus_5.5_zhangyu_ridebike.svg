        <line x1="364" y1="240" x2="364" y2="232" stroke="#1d1d1d" stroke-width="3"/>
        <g>
          <path d="M355 233 Q355 220 364 220 Q373 220 373 233 Z" fill="#f2c230" stroke="#1d1d1d" stroke-width="3" stroke-linejoin="round"/>
          <path d="M352 233 L376 233" stroke="#1d1d1d" stroke-width="3" stroke-linecap="round"/>
          <path d="M359 226 Q361 223 364 223" fill="none" stroke="#fff6c8" stroke-width="2" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" dur="3s" repeatCount="indefinite" values="0 364 233;0 364 233;-14 364 233;14 364 233;-10 364 233;8 364 233;0 364 233" keyTimes="0;0.7;0.75;0.8;0.85;0.9;1"/>
        </g>
        <path d="M380 218 Q386 226 380 234 M388 212 Q397 226 388 240" fill="none" stroke="#5a3d22" stroke-width="2.5" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.7;0.75;0.9;1"/>
