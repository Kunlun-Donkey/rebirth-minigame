<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>opus_5.5_zhangyu_ridebike</title>
  <defs>
    <!-- 圆形遮罩 -->
    <mask id="circleMask">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="256" r="240" fill="#fff"/>
    </mask>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f5"/>
      <stop offset="1" stop-color="#f7f1dc"/>
    </linearGradient>
    <radialGradient id="mantle" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9e8a"/>
      <stop offset="1" stop-color="#e2574c"/>
    </radialGradient>
  </defs>

  <g mask="url(#circleMask)">
    <!-- 背景与地面 -->
    <rect width="512" height="512" fill="url(#sky)"/>
    <path d="M0 440 Q128 420 256 440 T512 440 L512 512 L0 512 Z" fill="#e8d6a8" stroke="#5a3d22" stroke-width="3"/>
    <path d="M-40 470 L-10 470 M60 485 L100 485 M170 468 L200 468 M280 490 L320 490 M390 472 L420 472 M500 486 L540 486" stroke="#b89b62" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.9s" repeatCount="indefinite"/>
    </path>

    <g transform="translate(28 0)">
      <g transform="skewX(-5)">
        <ellipse cx="262" cy="448" rx="200" ry="10" fill="#5a3d22" opacity="0.18"/>

        <!-- ===== 远侧（车架后面）：触手踩远侧踏板 ===== -->
        <path d="M215 252 Q190 290 210 313 T225 350" fill="none" stroke="#3a1f1f" stroke-width="20" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M215 252 Q190 290 210 313 T225 350;M215 252 Q190 290 222.5 308 T250 340;M215 252 Q190 290 235 313 T275 350;M215 252 Q190 290 240 325.5 T285 375;M215 252 Q190 290 235 338 T275 400;M215 252 Q190 290 222.5 343 T250 410;M215 252 Q190 290 210 338 T225 400;M215 252 Q190 290 205 325.5 T215 375;M215 252 Q190 290 210 313 T225 350"/>
        </path>
        <path d="M215 252 Q190 290 210 313 T225 350" fill="none" stroke="#c9443b" stroke-width="13" stroke-linecap="round">
          <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M215 252 Q190 290 210 313 T225 350;M215 252 Q190 290 222.5 308 T250 340;M215 252 Q190 290 235 313 T275 350;M215 252 Q190 290 240 325.5 T285 375;M215 252 Q190 290 235 338 T275 400;M215 252 Q190 290 222.5 343 T250 410;M215 252 Q190 290 210 338 T225 400;M215 252 Q190 290 205 325.5 T215 375;M215 252 Q190 290 210 313 T225 350"/>
        </path>
        <!-- 远侧踏板：保持水平沿圆周走（起点 225°） -->
        <g>
          <rect x="-14" y="-4.5" width="28" height="9" rx="3" fill="#555" stroke="#1d1d1d" stroke-width="3"/>
          <animateMotion dur="1.2s" repeatCount="indefinite" path="M225.25 350.25 A35 35 0 0 1 274.75 399.75 A35 35 0 0 1 225.25 350.25"/>
        </g>
