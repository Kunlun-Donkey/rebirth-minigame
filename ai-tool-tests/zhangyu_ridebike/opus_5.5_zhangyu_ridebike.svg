        <!-- 身后触手：挥舞 -->
        <path d="M185 228 Q140 222 135 190 T108 158" fill="none" stroke="#3a1f1f" stroke-width="22" stroke-linecap="round">
          <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M185 228 Q140 222 135 190 T108 158;M185 228 Q138 232 126 204 T94 182;M185 228 Q140 222 135 190 T108 158"/>
        </path>
        <path d="M185 228 Q140 222 135 190 T108 158" fill="none" stroke="#e2574c" stroke-width="15" stroke-linecap="round">
          <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="M185 228 Q140 222 135 190 T108 158;M185 228 Q138 232 126 204 T94 182;M185 228 Q140 222 135 190 T108 158"/>
        </path>
        <!-- 身后触手：飘动 ×2 -->
        <path d="M195 250 Q165 282 145 268 T112 284" fill="none" stroke="#3a1f1f" stroke-width="20" stroke-linecap="round">
          <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M195 250 Q165 282 145 268 T112 284;M195 250 Q165 276 143 274 T110 276;M195 250 Q165 282 145 268 T112 284"/>
        </path>
        <path d="M195 250 Q165 282 145 268 T112 284" fill="none" stroke="#e2574c" stroke-width="13" stroke-linecap="round">
          <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M195 250 Q165 282 145 268 T112 284;M195 250 Q165 276 143 274 T110 276;M195 250 Q165 282 145 268 T112 284"/>
        </path>
        <path d="M205 256 Q192 286 172 280 T150 290" fill="none" stroke="#3a1f1f" stroke-width="18" stroke-linecap="round">
          <animate attributeName="d" dur="0.7s" repeatCount="indefinite" values="M205 256 Q192 286 172 280 T150 290;M205 256 Q192 282 170 284 T148 284;M205 256 Q192 286 172 280 T150 290"/>
        </path>
        <path d="M205 256 Q192 286 172 280 T150 290" fill="none" stroke="#d94e44" stroke-width="11" stroke-linecap="round">
          <animate attributeName="d" dur="0.7s" repeatCount="indefinite" values="M205 256 Q192 286 172 280 T150 290;M205 256 Q192 282 170 284 T148 284;M205 256 Q192 286 172 280 T150 290"/>
        </path>

