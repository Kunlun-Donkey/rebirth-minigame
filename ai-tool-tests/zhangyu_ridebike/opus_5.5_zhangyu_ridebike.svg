        <g>
          <line x1="250" y1="375" x2="225.25" y2="350.25" stroke="#1d1d1d" stroke-width="9" stroke-linecap="round"/>
          <line x1="250" y1="375" x2="225.25" y2="350.25" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0 250 375" to="360 250 375" dur="1.2s" repeatCount="indefinite"/>
        </g>

        <!-- ===== 自行车 ===== -->
        <!-- 后轮 -->
        <circle cx="150" cy="370" r="75" fill="none" stroke="#1d1d1d" stroke-width="12"/>
        <circle cx="150" cy="370" r="66" fill="none" stroke="#9aa3ad" stroke-width="3"/>
        <g>
          <path d="M150 304 L150 436 M84 370 L216 370 M103 323 L197 417 M197 323 L103 417" stroke="#6b7480" stroke-width="2"/>
          <path d="M150 304 L150 330" stroke="#e2574c" stroke-width="4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0 150 370" to="360 150 370" dur="0.9s" repeatCount="indefinite"/>
        </g>
        <circle cx="150" cy="370" r="7" fill="#9aa3ad" stroke="#1d1d1d" stroke-width="3"/>
        <!-- 前轮 -->
        <circle cx="370" cy="370" r="75" fill="none" stroke="#1d1d1d" stroke-width="12"/>
        <circle cx="370" cy="370" r="66" fill="none" stroke="#9aa3ad" stroke-width="3"/>
        <g>
          <path d="M370 304 L370 436 M304 370 L436 370 M323 323 L417 417 M417 323 L323 417" stroke="#6b7480" stroke-width="2"/>
          <path d="M370 304 L370 330" stroke="#e2574c" stroke-width="4" stroke-linecap="round"/>
          <animateTransform attributeName="transform" type="rotate" from="0 370 370" to="360 370 370" dur="0.9s" repeatCount="indefinite"/>
        </g>
        <circle cx="370" cy="370" r="7" fill="#9aa3ad" stroke="#1d1d1d" stroke-width="3"/>

