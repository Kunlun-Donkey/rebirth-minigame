        <g fill="none" stroke="#1d1d1d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
          <path d="M150 370 L250 375 L228 282 Z"/>
          <path d="M228 282 L340 278 L250 375"/>
          <path d="M340 278 L352 316 L370 370"/>
          <path d="M228 282 L222 262"/>
          <path d="M340 278 L343 248"/>
        </g>
        <g fill="none" stroke="#2f8f83" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M150 370 L250 375 L228 282 Z"/>
          <path d="M228 282 L340 278 L250 375"/>
          <path d="M340 278 L352 316 L370 370"/>
          <path d="M228 282 L222 262" stroke="#9aa3ad"/>
          <path d="M340 278 L343 248" stroke="#9aa3ad"/>
        </g>

        <!-- 车座 -->
        <path d="M196 262 Q222 252 248 260 Q244 270 222 268 Q205 269 196 262 Z" fill="#3b2a20" stroke="#1d1d1d" stroke-width="3"/>

        <!-- 车把与握套 -->
        <path d="M330 250 Q345 244 360 240 T384 244 L390 258" fill="none" stroke="#1d1d1d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M330 250 Q345 244 360 240 T384 244 L390 258" fill="none" stroke="#9aa3ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="385" y1="246" x2="390" y2="258" stroke="#1d1d1d" stroke-width="11" stroke-linecap="round"/>

